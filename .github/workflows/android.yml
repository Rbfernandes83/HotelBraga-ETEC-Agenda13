
name: Compilar Hotel Braga 2.0 Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Instalar MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar dependencias
        run: dotnet restore HotelBraga.csproj

      - name: Compilar APK de teste
        run: >
          dotnet publish HotelBraga.csproj
          -f net8.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HotelBraga-2.0-Android
          path: '**/bin/Debug/net8.0-android/**/*.apk'
          if-no-files-found: error
